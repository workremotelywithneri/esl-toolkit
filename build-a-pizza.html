<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Build a Pizza</title><style>
:root{--ink:#30261f;--acc:#d95836;--line:#e9dcc8;--sh:0 10px 28px rgba(73,49,27,.12)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{font-family:-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);user-select:none;background:radial-gradient(circle at 25% 10%,#fffdf7,#f7ecda 58%,#efe0ca)}
button{font:inherit;color:inherit;cursor:pointer}
.app{height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(8px,1.6vw,22px);padding:clamp(8px,1.6vh,16px);max-width:1700px;margin:auto}
/* PIZZA: layers = dough(1) < sauce(2) < cheese(3) < meat(4) < veg(5) < extras(6) */
.pcol{container-type:size;display:grid;place-items:center;min-height:0;min-width:0}
.pizza{position:relative;width:min(96cqw,96cqh);aspect-ratio:1;filter:drop-shadow(0 14px 16px rgba(91,55,25,.28))}
.lay{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
#base{z-index:1}#sauce{z-index:2;inset:6.5%;width:87%;height:87%;opacity:0}#cheese{position:absolute;inset:0;z-index:3}#tops{position:absolute;inset:0}
.pc{position:absolute;object-fit:contain;pointer-events:none;transform:translate(-50%,-50%) rotate(var(--r)) scale(var(--s));animation:pop .28s cubic-bezier(.2,.8,.2,1) both}
.pc.meat{z-index:4}.pc.veg{z-index:5}.pc.extra{z-index:6}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) rotate(var(--r)) scale(calc(var(--s)*.4))}}
@keyframes melt{from{opacity:0;transform:scale(.94)}}@keyframes fade{from{opacity:0;transform:scale(.95)}}
@keyframes bounce{45%{transform:scale(1.04)}}
.sp{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:#f3bb42;z-index:9;animation:sp .7s ease-out forwards}@keyframes sp{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
/* SIDE PANEL */
.side{display:flex;flex-direction:column;gap:clamp(6px,1.2vh,12px);min-height:0;min-width:0;background:rgba(255,253,248,.8);border:1px solid var(--line);border-radius:22px;padding:clamp(8px,1.4vh,16px);box-shadow:var(--sh)}
.bar{display:flex;justify-content:space-between;align-items:center}.bar b{font:700 clamp(15px,2.4vh,22px) Georgia,serif}
.ic{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:11px;font-size:17px;padding:0}
.bar>span{display:flex;gap:5px}.ic.num{font-weight:800;font-size:15px;letter-spacing:-.5px}.ic.on{background:var(--acc);border-color:var(--acc);color:#fff}
@media(max-height:560px){.ic{width:40px;height:40px}}
.dots{display:flex;gap:6px;container-type:inline-size}.dot{flex:1;min-width:0;white-space:nowrap;padding:0 clamp(3px,1.2cqw,10px);height:clamp(36px,5.4vh,44px);border:1px solid var(--line);background:rgba(255,255,255,.7);border-radius:999px;font-weight:700;font-size:clamp(14px,2vh,16px);display:flex;align-items:center;justify-content:center;gap:5px}
.dot span{display:none;font-size:clamp(11px,2.7cqw,14px)}@container (min-width:380px){.dot span{display:inline}}
.dot.lock{opacity:.5}
.dot.ok{background:#f2f8ec;border-color:#cfe2c3}.dot.cur{background:#fff;border:2px solid var(--acc);box-shadow:0 3px 10px rgba(217,88,54,.18)}
h2{margin:0;text-align:center;font:700 clamp(18px,3vh,28px) Georgia,serif}
.gw{flex:1;min-height:0;container-type:size}
.grid{--g:clamp(6px,1vh,10px);height:100%;display:grid;gap:var(--g);justify-content:center;align-content:center;
 --cw:min(calc((100cqw - (var(--cols) - 1)*var(--g))/var(--cols)),calc((100cqh - (var(--rows) - 1)*var(--g))/var(--rows)*.9));
 grid-template-columns:repeat(var(--cols),var(--cw));grid-auto-rows:calc(var(--cw)/.9)}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6% 4% 4%;background:#fff;border:2px solid var(--line);border-radius:16px;box-shadow:0 3px 9px rgba(83,55,28,.07);transition:transform .12s,border-color .12s}
.card{--bd:clamp(28px,calc(var(--cw)*.2),36px)}
.card::before{content:attr(data-n);display:none;position:absolute;z-index:3;left:calc(var(--bd)*-.25);top:calc(var(--bd)*-.25);width:var(--bd);height:var(--bd);align-items:center;justify-content:center;border-radius:50%;background:var(--ink);color:#fff;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);font:800 calc(var(--bd)*.56)/1 -apple-system,"Segoe UI",Arial,sans-serif;pointer-events:none}
.nums .card::before{display:flex}
.card:hover{border-color:#dca272}.card:active{transform:scale(.94)}
.card img{flex:1;min-height:0;width:100%;object-fit:contain;pointer-events:none}.card span{font-weight:700;font-size:clamp(11px,calc(var(--cw)*.13),17px);line-height:1.1;text-align:center}
@container (max-width:300px){.card span{display:none}}
.card.sel{border-color:var(--acc);background:#fff6ee}.card.sel::after{content:"✓";position:absolute;top:5px;right:7px;color:var(--acc);font-weight:800}
.nav{display:grid;grid-template-columns:auto auto 1fr;gap:8px}
.btn{height:clamp(44px,7dvh,60px);padding:0 clamp(14px,2vw,26px);border:1px solid var(--line);background:#fff;border-radius:14px;font-weight:700;font-size:clamp(15px,2.3vh,20px)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 5px 0 #a93e26}.btn.pri:active{transform:translateY(3px);box-shadow:0 2px 0 #a93e26}
.btn:disabled{opacity:.35;cursor:default}:focus-visible{outline:3px solid #4878c8;outline-offset:2px}
/* FINISHED: same pizza, enlarged; side panel hidden */
.fin{display:none;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.fin b{font:700 clamp(24px,5vh,46px) Georgia,serif;margin-right:10px}
.app.done{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.done .side{display:none}.done .fin{display:flex}.bounce{animation:bounce .6s ease}
@media(max-aspect-ratio:1/1){.app{grid-template-columns:1fr;grid-template-rows:minmax(0,.85fr) minmax(0,1.15fr)}.app.done{grid-template-rows:minmax(0,1fr) auto}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><main class="app" id="app">
<div class="pcol"><div class="pizza" id="pizza"><img class="lay" id="base" alt=""><img class="lay" id="sauce" alt=""><div id="cheese"></div><div id="tops"></div></div></div>
<aside class="side"><div class="bar"><b>Build a Pizza</b><span><button class="ic num" id="num" aria-label="Numbers on/off" aria-pressed="false" title="Numbers OFF">123</button><button class="ic" id="snd" aria-label="Sound">🔇</button><button class="ic" id="fs" aria-label="Fullscreen">⛶</button></span></div>
<div class="dots" id="dots"></div><h2 id="title"></h2><div class="gw"><div class="grid" id="grid"></div></div>
<div class="nav"><button class="btn" id="back" aria-label="Back">←</button><button class="btn" id="undo">↶ Undo</button><button class="btn pri" id="next"></button></div></aside>
<div class="fin" id="fin"><b id="msg"></b><button class="btn" id="edit">← Edit</button><button class="btn pri" id="new">New Pizza</button></div>
</main><script>

 s.done=o.done===true;s.msg=typeof o.msg==='string'?o.msg.slice(0,40):'';
 if(s.cheese!==null&&!s.cheeseP.length)s.cheeseP=genCheese(s.cheese);
 const m=maxStage(s);if(s.stage>m)s.stage=m;if(s.done&&m<4)s.done=false; // cannot be finished without sauce + cheese
 return{state:s,fixed}}
let S=fresh(),notice='';
{const raw=ls.get(KEY);if(raw){let o=null;try{o=JSON.parse(raw)}catch(e){}
 if(o&&typeof o==='object'&&!Array.isArray(o)){const c=cleanState(o);S=c.state;if(c.fixed)notice='Some damaged saved items were removed.'}
 else{ls.set(KEY+'.damaged',raw);notice='Saved pizza was damaged. A new pizza was started.'}}} // damaged data is kept under a backup key, valid saves are never touched on load
const save=()=>ls.set(KEY,JSON.stringify(S));
const has=i=>i===0?S.sauce!==null:i===1?S.cheese!==null:S.items.some(o=>o.c===Q[i].k);
const catOf=()=>({2:'meat',3:'veg',4:'extra'})[S.stage];
const undoable=()=>{const k=catOf();return !!k&&S.items.some(o=>o.c===k)};

/* ============ PIZZA RENDERING ============ */
const place=(el,x,y,size,r,s)=>{el.style.cssText=`left:${x*100}%;top:${y*100}%;width:${size}%;height:${size}%;--r:${r}deg;--s:${s}`};
function setSauce(anim){const el=$('#sauce');if(S.sauce===null){el.style.opacity=0;el.removeAttribute('src');return}
 el.src=PIX[Q[0].d[S.sauce][1]];el.style.opacity=1;el.style.animation=anim?'fade .35s ease both':'none'}
function genCheese(ci){const it=Q[1].d[ci],N=it[2],R=.40-it[3]/200,off=rnd(0,6.28),P=[]; // even spiral coverage, sauce rim stays visible
 for(let i=0;i<N;i++){const a=off+i*2.39996,r=R*Math.sqrt((i+.5)/N)+rnd(-.012,.012);P.push({x:+(.5+r*Math.cos(a)).toFixed(3),y:+(.5+r*Math.sin(a)).toFixed(3),r:Math.round(rnd(0,360)),s:+rnd(.9,1.15).toFixed(2)})}return P}
function drawCheese(anim){const L=$('#cheese');L.replaceChildren();if(S.cheese===null)return;const it=Q[1].d[S.cheese];
 S.cheeseP.forEach(p=>{const im=new Image();im.src=PIX[it[1]];im.className='pc';place(im,p.x,p.y,it[3],p.r,p.s);im.style.animation='none';L.append(im)});
 L.style.animation=anim?'melt .4s ease-out both':'none'}
function paint(o,anim,delay){const it=Q.find(q=>q.k===o.c).d[o.i],im=new Image();im.src=PIX[it[1]];im.alt='';im.className='pc '+o.c;im.dataset.b=o.b;
 place(im,o.x,o.y,it[3],o.r,o.s);im.style.animation=anim?`pop .28s ${delay}ms cubic-bezier(.2,.8,.2,1) both`:'none';$('#tops').append(im)}

/* ---- TOPPING PLACEMENT: hybrid coverage-aware planner (reach .40, art unchanged) ----
   Sparse pizza: the pieces of ONE click are planned together, spread over equal angular slots
   (starting at the emptiest direction, +/-20% jitter, +/-10% for 3-piece clicks) so a small batch can never sit on one side.
   Fuller pizza: each piece takes the best of 40 candidates over the whole disc.
   Both score candidates by edge-to-edge clearance (real visible piece size), capped so the rim is not favoured. */
const REACH=.40,VIS=.95,TAU=6.2832;
const footR=o=>Q.find(q=>q.k===o.c).d[o.i][3]/200*o.s*VIS;
function planBatch(n,size){
 const ex=S.items.map(o=>({x:o.x,y:o.y,r:footR(o),a:Math.atan2(o.y-.5,o.x-.5),d:Math.hypot(o.x-.5,o.y-.5)}));
 const dense=ex.reduce((a,o)=>a+o.r*o.r,0)/(REACH*REACH)>.40;let phi=0;
 if(!dense){const dens=a=>{let s=0;for(const o of ex){if(o.d<.05)continue;let da=Math.abs(a-o.a);da=Math.min(da,TAU-da);s+=o.r*o.r*Math.exp(-da*da/(2*.55*.55))}return s};
  let bs=1e9;for(let j=0;j<16;j++){const p=rnd(0,TAU);let s=0;for(let k=0;k<n;k++)s+=dens(p+TAU*(k+.5)/n);s+=Math.random()*1e-7;if(s<bs){bs=s;phi=p}}}
 const out=[],JIT=n<=3?.1:.2; // 3-piece clicks: tighter slots so a wide empty arc is rarer
 for(let k=0;k<n;k++){const sc=+rnd(.9,1.12).toFixed(2),rv=size/200*sc*VIS,Rc=REACH-rv,T=.5*Math.sqrt(Math.PI*REACH*REACH/(ex.length+4));let best=null,bs=-1e9;
  for(let i=0,N=dense?40:14;i<N;i++){const a=dense?rnd(0,TAU):phi+TAU*(k+.5+rnd(-JIT,JIT))/n,rr=Rc*Math.sqrt(Math.random()),x=.5+rr*Math.cos(a),y=.5+rr*Math.sin(a);
   let c=9;for(const o of ex){const g=Math.hypot(o.x-x,o.y-y)-(rv+o.r);if(g<c)c=g}
   const v=Math.min(c,T)+Math.random()*1e-5;if(v>bs){bs=v;best={x,y}}}
  out.push({x:best.x,y:best.y,s:sc});ex.push({x:best.x,y:best.y,r:rv,a:Math.atan2(best.y-.5,best.x-.5),d:Math.hypot(best.x-.5,best.y-.5)})}
 for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]} // random pop-in order
 return out}
function addBatch(si,ii){const st=Q[si],it=st.d[ii],n=Math.min(it[2],st.cap-S.items.filter(o=>o.c===st.k).length);
 if(n<=0){$('#pizza').animate([{transform:'translateX(0)'},{transform:'translateX(-7px)'},{transform:'translateX(7px)'},{transform:'none'}],{duration:240});
  hint('Plenty of '+st.n.toLowerCase()+' already!',1400);return}
 const b=++S.nb;planBatch(n,it[3]).forEach((p,i)=>{const o={b,c:st.k,i:ii,x:+p.x.toFixed(3),y:+p.y.toFixed(3),r:Math.round(it[4]?rnd(0,360):rnd(-35,35)),s:p.s};S.items.push(o);paint(o,true,i*45)});
 save();ui()}

/* ============ PICKER (rebuilt only when the stage changes) ============ */
let hintT=0;
function hint(msg,ms){const t=$('#title');t.textContent=msg;clearTimeout(hintT);hintT=setTimeout(()=>{t.textContent=Q[S.stage].t},ms||1800)}
function stage(){const st=Q[S.stage],g=$('#grid'),n=st.d.length,cols=n<=4?2:n<=6?3:4;clearTimeout(hintT);
 $('#title').textContent=st.t;g.style.setProperty('--cols',cols);g.style.setProperty('--rows',Math.ceil(n/cols));
 g.innerHTML=st.d.map((d,i)=>`<button class="card${st.one&&S[st.k]===i?' sel':''}" data-i="${i}" data-n="${i+1}"><img src="${PIX[d[1]]}" alt=""><span>${d[0]}</span></button>`).join('')}
function ui(){const m=maxStage(S),st=S.stage,u=$('#undo'),nx=$('#next');
 u.disabled=!undoable();u.title=st<2?'Undo is for toppings (Meat, Veggies, Extras)':u.disabled?'Nothing to undo on this stage':'Undo the last click on this stage';
 nx.textContent=st===4?'Finish 🍕':(st<2||has(st))?'Next →':'Skip →';
 nx.disabled=(st<2&&!has(st))||(st===4&&m<4); // Sauce and Cheese cannot be skipped
 $('#back').disabled=st===0;
 $('#dots').innerHTML=Q.map((q,i)=>`<button class="dot${i===st?' cur':has(i)?' ok':''}${i>m?' lock':''}" data-i="${i}" aria-disabled="${i>m}">${q.e}<span>${q.n}</span></button>`).join('')}
/* single gate for EVERY way of changing stage (Next, Back, stage tabs, restore) */
function go(i){i=Math.max(0,Math.min(4,i));const m=maxStage(S);
 if(i>m){hint(S.sauce===null?'Choose one sauce first.':'Choose one type of cheese first.');return false}
 S.stage=i;save();stage();ui();return true}
let navAt=0; // Next/Back ignore a second click within 300 ms (double-click), tabs are never blocked
const calm=()=>Date.now()-navAt>=300;
$('#dots').onclick=e=>{const d=e.target.closest('.dot');if(d)go(+d.dataset.i)};
$('#grid').onclick=e=>{const c=e.target.closest('.card');if(!c)return;const i=+c.dataset.i,st=Q[S.stage],at=S.stage;
 c.animate([{transform:'scale(.92)'},{transform:'scale(1)'}],{duration:200});
 if(!st.one)return addBatch(at,i);
 if(S[st.k]===i)return; // same choice again: nothing changes (cheese is not re-rolled)
 if(at===0){S.sauce=i;setSauce(true)}else{S.cheese=i;S.cheeseP=genCheese(i);drawCheese(true)}
 [...$('#grid').children].forEach(x=>x.classList.toggle('sel',x===c));clearTimeout(hintT);$('#title').textContent=st.t;save();ui()}; // stays on this stage: teacher presses Next
$('#next').onclick=()=>{if(!calm())return;if(S.stage===4)return finish();if(S.stage<2&&!has(S.stage))return;if(go(S.stage+1))navAt=Date.now()};
$('#back').onclick=()=>{if(!calm())return;if(go(S.stage-1))navAt=Date.now()};
$('#undo').onclick=()=>{const k=catOf(),mine=k?S.items.filter(o=>o.c===k):[];if(!mine.length)return;const b=Math.max(...mine.map(o=>o.b));S.items=S.items.filter(o=>!(o.c===k&&o.b===b));
 document.querySelectorAll(`[data-b="${b}"]`).forEach(e=>e.remove());save();ui()};

/* ============ NUMBERS (teacher option, default OFF, never part of the pizza state) ============ */
let numsOn=ls.get('bapNumbers')==='1';
function applyNums(){$('#app').classList.toggle('nums',numsOn);const b=$('#num');b.classList.toggle('on',numsOn);b.setAttribute('aria-pressed',numsOn);b.title=numsOn?'Numbers ON':'Numbers OFF'}
$('#num').onclick=()=>{numsOn=!numsOn;ls.set('bapNumbers',numsOn?'1':'0');applyNums()};

/* ============ FINISH / RESET ============ */
let snd=ls.get('bapSound')==='1',AC;
function chime(){if(!snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.frequency.value=523;
 g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(AC.destination);o.start();o.stop(t+.25)}catch(e){}}
function finish(){if(maxStage(S)<4){go(maxStage(S));return}S.done=true;S.msg=MSG[Math.floor(Math.random()*MSG.length)];save();showDone(true)}
function showDone(first){$('#app').classList.add('done');$('#msg').textContent=S.msg||'Your pizza is ready!';
 if(!first)return;const p=$('#pizza');p.classList.remove('bounce');void p.offsetWidth;p.classList.add('bounce');chime();
 for(let i=0;i<10;i++){const s=document.createElement('i');s.className='sp';s.style.setProperty('--dx',rnd(-.4,.4)*p.offsetWidth+'px');s.style.setProperty('--dy',rnd(-.4,.4)*p.offsetWidth+'px');p.append(s);setTimeout(()=>s.remove(),800)}}
$('#edit').onclick=()=>{S.done=false;save();$('#app').classList.remove('done');stage();ui()};
let armed=0;$('#new').onclick=function(){if(!armed){armed=1;this.textContent='Tap again to confirm';setTimeout(()=>{armed=0;this.textContent='New Pizza'},3000);return}
 armed=0;this.textContent='New Pizza';S=fresh();save();init()};
$('#snd').onclick=()=>{snd=!snd;ls.set('bapSound',snd?'1':'0');$('#snd').textContent=snd?'🔊':'🔇'};
$('#fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();

/* ============ START: rebuild everything from saved state ============ */
function init(){$('#app').classList.remove('done');$('#base').src=PIX.dough;$('#tops').replaceChildren();setSauce(false);drawCheese(false);
 S.items.forEach(o=>paint(o,false));$('#snd').textContent=snd?'🔊':'🔇';applyNums();stage();ui();if(S.done)showDone(false);if(notice){hint(notice,3500);notice=''}}
Object.values(PIX).forEach(s=>{new Image().src=s});init();
</script></body></html>
